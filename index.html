<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Ecosystem - Admin Workspace</title>
    <style>
        /* 1. GLOBAL PREMIUM SETUP */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #000;
            color: #f5f5f7;
            min-height: 100vh;
            overflow-x: hidden;
            padding-top: 80px; 
        }

        /* 2. BACKGROUND LAYER: BLURRED MOVING COLOR WHEEL */
        .bg-container {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            z-index: 1;
            overflow: hidden;
            background: #000;
        }
        .color-wheel {
            position: absolute;
            top: -50%; left: -50%;
            width: 200%; height: 200%;
            background: conic-gradient(from 0deg, #ff2d55, #007aff, #5856d6, #ffcc00, #ff2d55);
            filter: blur(140px);
            opacity: 0.3;
            animation: rotateWheel 30s linear infinite;
        }
        @keyframes rotateWheel {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        canvas {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            z-index: 2;
            opacity: 0.35;
            pointer-events: none;
        }

        /* 3. PREMIUM APPLE NAVIGATION HEADER */
        .apple-nav {
            position: fixed;
            top: 0; left: 0; width: 100%;
            height: 54px;
            background: rgba(22, 22, 23, 0.75);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 100;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 30px;
        }
        .nav-link {
            color: #a1a1a6;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 400;
            transition: color 0.3s ease;
            cursor: pointer;
        }
        .nav-link:hover, .nav-link.active {
            color: #fff;
        }

        /* 4. BASE APP CONTAINER PLATFORM */
        .app-view {
            position: relative;
            z-index: 3;
            display: none; 
            width: 90%;
            max-width: 1100px;
            margin: 40px auto;
            animation: fadeIn 0.5s ease forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 5. INDIVIDUAL VIEW STYLES */
        .linktree-centered {
            max-width: 420px;
            margin: 40px auto;
            text-align: center;
            background: rgba(22, 22, 23, 0.6);
            backdrop-filter: blur(30px) saturate(210%);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 28px;
            padding: 40px 32px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }
        .profile-img {
            width: 90px; height: 90px; border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.3); margin-bottom: 16px;
        }
        .link-btn {
            display: block; padding: 14px; color: #fff; text-decoration: none;
            background: rgba(255, 255, 255, 0.06); border-radius: 12px; margin-top: 12px;
            border: 1px solid rgba(255, 255, 255, 0.05); transition: 0.3s;
        }
        .link-btn:hover { background: rgba(255, 255, 255, 0.15); transform: scale(1.02); }

        .glass-card {
            background: rgba(22, 22, 23, 0.6);
            backdrop-filter: blur(30px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.4);
        }
        h2 { font-size: 1.8rem; font-weight: 600; margin-bottom: 24px; letter-spacing: -0.5px; }
        
        .form-grid {
            display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 24px;
        }
        .input-group { display: flex; flex-direction: column; gap: 8px; }
        .input-group.full-width { grid-column: span 2; }
        label { font-size: 0.8rem; color: #86868b; font-weight: 500; }
        input, select, textarea {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px; padding: 12px 16px; color: #fff;
            font-family: inherit; font-size: 0.95rem; transition: all 0.3s;
        }
        input:focus, select:focus, textarea:focus {
            outline: none; border-color: #007aff; background: rgba(255, 255, 255, 0.09);
        }
        .action-btn {
            background: #007aff; color: #fff; border: none; padding: 14px 28px;
            border-radius: 12px; font-weight: 500; font-size: 0.95rem; cursor: pointer; transition: 0.2s;
        }
        .action-btn:hover { background: #1485ff; transform: translateY(-1px); }

        /* 6. DIVERSIFIED CLICKUP-STYLE CONTAINER GRID */
        .workspace-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 24px;
        }
        @media(max-width: 900px) { .workspace-grid { grid-template-columns: 1fr; } }
        
        .workspace-column {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 16px; padding: 20px;
            display: flex; flex-direction: column; gap: 14px;
            min-height: 300px;
        }
        .column-header {
            font-size: 0.9rem; font-weight: 600; color: #86868b;
            text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px;
            display: flex; justify-content: space-between; align-items: center;
        }
        .badge {
            font-size: 0.75rem; background: rgba(255, 255, 255, 0.1);
            padding: 2px 8px; border-radius: 20px; color: #fff;
        }
        
        /* New styling wrapper specifically for dynamic note blocks */
        .notes-container-area {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        
        .task-card {
            background: rgba(22, 22, 23, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px; padding: 16px;
            cursor: pointer; transition: all 0.3s ease;
            position: relative;
        }
        .task-card:hover {
            border-color: rgba(255, 255, 255, 0.2);
            background: rgba(32, 32, 35, 0.8);
            transform: translateY(-2px);
        }
        .task-title { font-size: 0.95rem; font-weight: 500; margin-bottom: 6px; color: #fff; }
        .task-desc { font-size: 0.85rem; color: #86868b; line-height: 1.4; }
        .tag {
            display: inline-block; font-size: 0.7rem; padding: 2px 6px; 
            border-radius: 4px; font-weight: 600; margin-top: 10px;
        }
        .tag.blue { background: rgba(0, 122, 255, 0.15); color: #007aff; }
        .tag.purple { background: rgba(88, 86, 214, 0.15); color: #5856d6; }
        .tag.orange { background: rgba(255, 149, 0, 0.15); color: #ff9500; }
        
        .delete-note-btn {
            position: absolute;
            top: 10px; right: 10px;
            background: none; border: none; color: #ff453a;
            font-size: 0.8rem; cursor: pointer; display: none;
        }
        .task-card:hover .delete-note-btn {
            display: block;
        }
    </style>
</head>
<body>

    <div class="bg-container"><div class="color-wheel"></div></div>
    <canvas id="matrixCanvas"></canvas>

    <nav class="apple-nav">
        <span class="nav-link active" onclick="switchView('linktree-view')">Public Linktree</span>
        <span class="nav-link" onclick="switchView('onboarding-view')">Client Onboarding</span>
        <span class="nav-link" onclick="switchView('dashboard-view')">ClickUp Workspace</span>
    </nav>

    <!-- VIEW 1 -->
    <div id="linktree-view" class="app-view" style="display: block;">
        <div class="linktree-centered">
            <img class="profile-img" src="https://placeholder.com" alt="Profile">
            <h1>Matrix Ecosystem</h1>
            <p class="bio" style="color: #86868b; margin-bottom: 20px;">Premium Collective Interface</p>
            <div class="link-btn">Access Client Portals</div>
            <div class="link-btn">Schedule Management Sync</div>
            <div class="link-btn">Community Hub</div>
        </div>
    </div>

    <!-- VIEW 2: REAL CLIENT SUBMISSION (Saves to Workspace) -->
    <div id="onboarding-view" class="app-view">
        <div class="glass-card">
            <h2>Create Potential Client Account</h2>
            <form id="onboardingForm" onsubmit="handleClientOnboarding(event)">
                <div class="form-grid">
                    <div class="input-group">
                        <label>Company Name</label>
                        <input type="text" id="companyName" placeholder="e.g. Acme Tech Corp" required>
                    </div>
                    <div class="input-group">
                        <label>Primary Industry</label>
                        <select id="industry">
                            <option>Software Development</option>
                            <option>Creative & Design Agency</option>
                            <option>E-Commerce Ecosystem</option>
